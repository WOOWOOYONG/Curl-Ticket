<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Curl Ticket">
  <mask id="ct-ticket" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <!-- ticket body (visible) -->
    <rect x="7" y="15" width="50" height="34" rx="6" fill="white"/>
    <!-- perforation notches cut into left & right edges -->
    <circle cx="7" cy="32" r="5" fill="black"/>
    <circle cx="57" cy="32" r="5" fill="black"/>
    <!-- terminal prompt ">" knocked out -->
    <path d="M22 26 L28 32 L22 38" fill="none" stroke="black" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- underscore "_" knocked out -->
    <rect x="32" y="36.4" width="11" height="3.4" rx="1.7" fill="black"/>
  </mask>
  <rect width="64" height="64" fill="currentColor" mask="url(#ct-ticket)"/>
</svg>
