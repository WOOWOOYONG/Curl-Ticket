pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,vue,json,jsonc,md}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,vue}'
      run: pnpm exec oxlint {staged_files}
